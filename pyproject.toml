[project]
name = "tropicast"
version = "0.2.0"
description = "Research decision-support prototype for North Indian Ocean tropical cyclone tracking and intensity forecasting. Not an official warning product."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "requests>=2.31",
  "netCDF4>=1.6",
  "xarray>=2024.1",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
era5 = ["cdsapi>=0.7", "xarray>=2024.1", "netCDF4>=1.6"]

[project.scripts]
tropicast = "tropicast.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
